<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>连接 Secrets Broker</title>
<style>
  :root { color-scheme: light dark; font-family: "Segoe UI", system-ui, sans-serif; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #f3f5f8; color: #1b2430; }
  .card { width: min(620px, calc(100vw - 48px)); background: #fff; border: 1px solid #dde3ea; border-radius: 16px; padding: 30px; box-shadow: 0 18px 48px rgba(20, 40, 70, .10); }
  .brand { display: flex; align-items: center; gap: 12px; font-size: 20px; font-weight: 700; }
  .brand img { width: 34px; height: 34px; }
  h1 { margin: 28px 0 8px; font-size: 24px; }
  p { line-height: 1.6; color: #5b6878; }
  label { display: block; margin: 22px 0 8px; font-weight: 600; }
  input { box-sizing: border-box; width: 100%; padding: 13px 14px; border: 1px solid #cfd8e3; border-radius: 10px; font: inherit; background: #fbfcfe; color: inherit; }
  input:focus { outline: 2px solid #2f7cf6; border-color: transparent; }
  button { margin-top: 16px; width: 100%; padding: 13px 16px; border: 0; border-radius: 10px; background: #1f6feb; color: #fff; font: inherit; font-weight: 700; cursor: pointer; }
  button:disabled { opacity: .6; cursor: wait; }
  .hint { font-size: 13px; color: #778394; }
  #msg { min-height: 24px; margin: 12px 0 0; color: #b42318; }
  .diag { margin-top: 22px; padding-top: 18px; border-top: 1px solid #dde3ea; }
  .diag button { margin-top: 8px; background: #eef2f7; color: #1b2430; }
  .diag pre { max-height: 220px; overflow: auto; padding: 12px; border-radius: 10px; background: #f6f8fb; font-size: 12px; white-space: pre-wrap; }
  details { margin-top: 18px; color: #5b6878; font-size: 13px; line-height: 1.6; }
  @media (prefers-color-scheme: dark) {
    body { background: #11161d; color: #e8edf4; }
    .card { background: #1a212b; border-color: #2c3644; box-shadow: none; }
    p, .hint { color: #9aa8ba; }
    input { background: #111821; border-color: #344154; }
  }
</style>
</head>
<body>
<main class="card">
  <div class="brand"><img src="logo.png" alt="">Secrets Broker</div>
  <h1>先连接你的服务器</h1>
  <p>桌面端会直接打开这个地址上的控制台。登录、OIDC 和 Vault 解锁都在服务器上进行；托盘和本地 sidecar 仍然在这台电脑上运行。</p>
  <form id="form">
    <label for="url">服务器地址</label>
    <input id="url" name="url" type="url" value="https://sb.otscup.com" placeholder="https://sb.otscup.com" autocomplete="url" required>
    <div class="hint" style="margin-top:8px">必须使用 https；本机调试可以用 http://127.0.0.1:8787。只填根地址，不要带路径。</div>
    <button id="connect" type="submit">连接并打开控制台</button>
  </form>
  <details>
    <summary>第一次使用</summary>
    <p>连接后先在网页登录；桌面端会常驻托盘并启动本地 sidecar。需要接入本地 agent 时，在网页的「本地 Agent」里一键连接；解锁密码默认记住 12 小时。</p>
  </details>
  <p id="msg"></p>
  <div class="diag">
    <button id="diag" type="button">查看诊断信息</button>
    <pre id="diagOut" hidden></pre>
  </div>
  <p class="hint">想改地址：关闭窗口后从托盘菜单打开「服务器设置」。</p>
</main>
<script>
  const invoke = window.__TAURI__?.core?.invoke
  const form = document.getElementById('form')
  const input = document.getElementById('url')
  const button = document.getElementById('connect')
  const msg = document.getElementById('msg')
  const diag = document.getElementById('diag')
  const diagOut = document.getElementById('diagOut')

  if (!invoke) {
    msg.textContent = '桌面接口没有加载，请重新安装或从托盘重新打开。'
    button.disabled = true
  } else {
    invoke('get_server').then((saved) => { if (saved) input.value = saved }).catch(() => {})
    diag.addEventListener('click', async () => {
      diag.disabled = true
      try {
        const info = await invoke('get_diagnostics')
        diagOut.textContent = JSON.stringify(info, null, 2)
        diagOut.hidden = false
      } catch (error) {
        diagOut.textContent = '诊断读取失败：' + String(error)
        diagOut.hidden = false
      } finally {
        diag.disabled = false
      }
    })
    form.addEventListener('submit', async (event) => {
      event.preventDefault()
      button.disabled = true
      msg.textContent = '正在连接…'
      try {
        await invoke('connect_server', { url: input.value })
      } catch (error) {
        msg.textContent = String(error)
        button.disabled = false
      }
    })
  }
</script>
</body>
</html>
