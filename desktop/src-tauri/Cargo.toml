[package]
name = "secrets-broker-desktop"
version = "0.2.26"
description = "Secrets Broker desktop shell"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "secrets_broker_desktop_lib"
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
# 2.6.3 is the patch that fills rust-ini's new ParseOption fields with
# `..Default::default()`; 2.6.2 does not compile on Linux against rust-ini 0.21.3.
tauri-plugin-deep-link = "2.6.3"
tauri-plugin-notification = "2"
url = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging"] }
