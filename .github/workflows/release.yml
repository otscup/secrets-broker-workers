name: release

# Manual only on purpose: a stray `git push --tags` must not publish a public
# Release. Run this from Actions → release after the tag is already on main.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to publish, vX.Y.Z'
        required: true
        type: string

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          # Full history so --generate-notes can diff against the previous tag.
          fetch-depth: 0
          ref: ${{ inputs.tag }}

      - name: Verify the tag matches package.json
        shell: bash
        env:
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          # The value is data, never interpolated into the script.
          if ! [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "tag must look like vX.Y.Z, got: $TAG"
            exit 1
          fi
          declared="v$(node -p "require('./package.json').version")"
          if [ "$TAG" != "$declared" ]; then
            echo "tag $TAG does not match package.json $declared"
            exit 1
          fi

      - name: Publish the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: gh release create "$TAG" --generate-notes --title "$TAG" --verify-tag
