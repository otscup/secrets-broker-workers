name: desktop-release

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - 'desktop-v*'

permissions:
  # Only softprops/action-gh-release at the end needs to write. Splitting the
  # publish step into its own job would let the build steps run with
  # contents: read, but that also means moving artefacts between jobs; until
  # that is worth the churn this stays job-wide.
  contents: write

# Actions are referenced by tag so security updates arrive; .github/dependabot.yml
# keeps those tags current. Pin to commit SHAs only if the extra review burden
# of manual bumps is acceptable.

jobs:
  build-windows:
    # Installers are only built for a release or a manual run. Pushes to main
    # now trigger this workflow so the desktop-check matrix below runs; that must
    # not start a full Windows bundle every time.
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/desktop-v')
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri

      - run: npm ci --no-audit --no-fund
      - run: npm run test:release
      - run: npm run test:desktop-pair
      - run: npm run test:redact
      - run: npm run test:desktop-setup
      - run: npm run test:webpush
      - run: npm run desktop:build
      - run: npm run release:check

      - name: Write SHA-256 sums
        shell: pwsh
        run: |
          $assetDir = "desktop/src-tauri/target/release"
          $files = @(
            Get-ChildItem "$assetDir/bundle/msi/*.msi" | Sort-Object LastWriteTime -Descending | Select-Object -First 1
            Get-Item "$assetDir/secrets-broker-desktop.exe"
          )
          $lines = foreach ($file in $files) {
            $hash = (Get-FileHash -Algorithm SHA256 $file.FullName).Hash.ToLowerInvariant()
            "$hash  $($file.Name)"
          }
          $lines | Set-Content -Encoding ascii SHA256SUMS.txt

      - uses: actions/upload-artifact@v4
        with:
          name: secrets-broker-desktop-${{ github.run_number }}
          path: |
            desktop/src-tauri/target/release/bundle/msi/*.msi
            desktop/src-tauri/target/release/secrets-broker-desktop.exe
            SHA256SUMS.txt
          if-no-files-found: error

      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/desktop-v')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Secrets Broker ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            desktop/src-tauri/target/release/bundle/msi/*.msi
            desktop/src-tauri/target/release/secrets-broker-desktop.exe
            SHA256SUMS.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  desktop-check:
    # Compile the desktop shell on macOS and Linux. Only Windows was ever built,
    # so every `#[cfg(not(windows))]` branch (the native confirmation prompt)
    # shipped without a compiler ever looking at it. This job only checks: no
    # bundling, no signing and no release, so it can stay read-only.
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os:
          - macos-latest
          - ubuntu-22.04
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config libssl-dev \
            libgtk-3-dev libwebkit2gtk-4.1-dev libjavascriptcoregtk-4.1-dev \
            libsoup-3.0-dev librsvg2-dev libayatana-appindicator3-dev libxdo-dev

      # Both inputs the build script needs are generated and git-ignored, so a
      # fresh checkout has neither: `tauri-build` panics when a
      # `bundle.resources` entry is missing (resources/sidecar) and
      # `tauri-codegen` panics when `frontendDist` does not exist (desktop/ui).
      # Building them here means the check compiles against exactly what the
      # Windows release job packages instead of empty placeholders.
      - run: npm ci --no-audit --no-fund
      - run: npm run desktop:ui
      - run: npm run desktop:sidecar

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri
          key: desktop-check

      - name: cargo check (desktop)
        shell: bash
        run: |
          log="$RUNNER_TEMP/cargo-check.log"
          set -o pipefail
          if cargo check --manifest-path desktop/src-tauri/Cargo.toml --all-targets 2>&1 | tee "$log"; then
            exit 0
          fi
          # GitHub does not annotate cargo output, and downloading a job log
          # needs repository admin, so the errors are repeated here where the
          # public run page can show them. A proc-macro panic carries its reason
          # in the `help: message` line, not in the `error` line above it, and
          # cargo's colour codes have to go or they end up in the annotation.
          sed -e 's/\x1b\[[0-9;]*m//g' "$log" | grep -E '^error|help: message' | head -n 10 | while IFS= read -r line; do
            printf '::error::%s\n' "$line"
          done
          {
            echo '### cargo check failed'
            echo '```'
            tail -n 120 "$log"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit 1
