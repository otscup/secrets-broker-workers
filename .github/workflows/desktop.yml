name: desktop-release

on:
  workflow_dispatch:
  push:
    tags:
      - 'desktop-v*'

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri

      - run: npm ci --no-audit --no-fund
      - run: npm run test:release
      - run: npm run test:desktop-pair
      - run: npm run desktop:build
      - run: npm run release:check

      - uses: actions/upload-artifact@v4
        with:
          name: secrets-broker-desktop-${{ github.run_number }}
          path: |
            desktop/src-tauri/target/release/bundle/msi/*.msi
            desktop/src-tauri/target/release/secrets-broker-desktop.exe
          if-no-files-found: error

      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/desktop-v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = $env:GITHUB_REF_NAME
          $msi = Get-ChildItem "desktop/src-tauri/target/release/bundle/msi/*.msi" | Select-Object -First 1
          gh release create $tag $msi.FullName "desktop/src-tauri/target/release/secrets-broker-desktop.exe" --title "Secrets Broker $tag" --generate-notes
