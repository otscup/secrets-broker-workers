name: desktop-release

on:
  workflow_dispatch:
  push:
    tags:
      - 'desktop-v*'

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri

      - run: npm ci --no-audit --no-fund
      - run: npm run test:release
      - run: npm run test:desktop-pair
      - run: npm run test:redact
      - run: npm run test:desktop-setup
      - run: npm run test:webpush
      - run: npm run desktop:build
      - run: npm run release:check

      - name: Write SHA-256 sums
        shell: pwsh
        run: |
          $assetDir = "desktop/src-tauri/target/release"
          $files = @(
            Get-ChildItem "$assetDir/bundle/msi/*.msi" | Sort-Object LastWriteTime -Descending | Select-Object -First 1
            Get-Item "$assetDir/secrets-broker-desktop.exe"
          )
          $lines = foreach ($file in $files) {
            $hash = (Get-FileHash -Algorithm SHA256 $file.FullName).Hash.ToLowerInvariant()
            "$hash  $($file.Name)"
          }
          $lines | Set-Content -Encoding ascii SHA256SUMS.txt

      - uses: actions/upload-artifact@v4
        with:
          name: secrets-broker-desktop-${{ github.run_number }}
          path: |
            desktop/src-tauri/target/release/bundle/msi/*.msi
            desktop/src-tauri/target/release/secrets-broker-desktop.exe
            SHA256SUMS.txt
          if-no-files-found: error

      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/desktop-v')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Secrets Broker ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            desktop/src-tauri/target/release/bundle/msi/*.msi
            desktop/src-tauri/target/release/secrets-broker-desktop.exe
            SHA256SUMS.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
