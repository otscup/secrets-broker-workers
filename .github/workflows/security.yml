name: security

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  security-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm install --no-audit --no-fund
      # Pure unit suites (no runtime required).
      - name: OIDC unit tests
        run: npm run test:oidc
      - name: R1/R6 atomic + scope predicate
        run: npm run test:r1-r6
      # workerd-backed suites: real Durable Object storage/transaction semantics.
      - name: OIDC state replay (Miniflare)
        run: npm run test:mcp-oidc
      - name: maxReads concurrency (Miniflare)
        run: npm run test:maxreads
      - name: Agent permission matrix (Miniflare)
        run: npm run test:permissions
      - name: Hybrid secret.read/use model (Miniflare)
        run: npm run test:actions
      - name: Approval pipeline bypass (Miniflare)
        run: npm run test:approval
      - name: Admin API authorization (Miniflare)
        run: npm run test:admin-api
      - name: Unified capabilities (Miniflare)
        run: npm run test:capabilities
      - name: Capability admin API (Miniflare)
        run: npm run test:capabilities-admin
      - name: Bulk grants + agent write (Miniflare)
        run: npm run test:batch-write
      - name: Approval bound to its target (Miniflare)
        run: npm run test:target-binding
      - name: Independent review regression (Miniflare)
        run: npm run test:review-fixes
      - name: State machine edge cases (Miniflare)
        run: npm run test:state-machine
      - name: Capability ensure authority (Miniflare)
        run: npm run test:ensure-authority
      - name: Legacy scope behaviour (Miniflare)
        run: npm run test:legacy-scope
      - name: Migration identity + real revoke (Miniflare)
        run: npm run test:identity-revoke
      - name: Account scoping (Miniflare)
        run: npm run test:account-scope
      - name: Agent authorization extension (Miniflare)
        run: npm run test:agent-extend
      - name: OAuth consent login flow (Miniflare)
        run: npm run test:oauth-consent
      - name: OAuth client persistence (Miniflare)
        run: npm run test:oauth-persist
      - name: OAuth client management (Miniflare)
        run: npm run test:oauth-clients
      - name: OAuth re-login resume (Miniflare)
        run: npm run test:oauth-resume
      - name: Admin session durability (Miniflare)
        run: npm run test:session
      - name: State write safety (Miniflare)
        run: npm run test:state-write
      - name: Stale cookie clearing (Miniflare)
        run: npm run test:cookie-clearing
      - name: Admin UI smoke (Miniflare)
        run: npm run test:ui
      - name: Authorization reminders (Miniflare)
        run: npm run test:reminders
      - name: Item activity columns (Miniflare)
        run: npm run test:items
      - name: Scheduled reminder handler (Miniflare)
        run: npm run test:scheduled
      - name: Geo event storage (Miniflare)
        run: npm run test:geo-storage
      - name: Geo event capture (Miniflare)
        run: npm run test:geo-capture
      - name: Globe UI (Miniflare)
        run: npm run test:globe-ui
      - name: Globe arcs (Miniflare)
        run: npm run test:globe-arcs
      - name: Globe route variance
        run: npm run test:globe-routes
      - name: Globe visuals (Miniflare)
        run: npm run test:globe-visuals
      - name: Globe earth and danmaku (Miniflare)
        run: npm run test:globe-earth
      - name: Globe init and failure reporting (Miniflare)
        run: npm run test:globe-init
      - name: UI undefined-call scan
        run: npm run test:ui-undefined
      - name: Reported bug fixes (Miniflare)
        run: npm run test:bugfixes
      - name: Globe API guard
        run: npm run test:globe-api
      - name: UI polish (Miniflare)
        run: npm run test:ui-polish
      - name: Layout and naming (Miniflare)
        run: npm run test:layout
      - name: Panel polish (Miniflare)
        run: npm run test:panel
      - name: Donut legend layout
        run: npm run test:donut
      - name: Web fill (P1)
        run: npm run test:fill
      - name: Fill task control plane (P3.0)
        run: npm run test:fill-task
      - name: Secret expiry (P3.1)
        run: npm run test:secret-expiry
      - name: OIDC EdDSA verification
        run: npm run test:oidc-eddsa
      - name: Fill UI placement
        run: npm run test:fill-placement
      - name: OIDC providers and identity binding
        run: npm run test:oidc-providers
      - name: Login page lists every provider
        run: npm run test:login-providers
      - name: Default OIDC provider is editable
        run: npm run test:oidc-default
      - name: Grant delete and restore
        run: npm run test:grant-delete
      - name: Unclassified credentials refuse plaintext
        run: npm run test:require-classification
      - name: Plugin usage and wait endpoints
        run: npm run test:plugin-endpoints
      - name: Plugin operator endpoints
        run: npm run test:plugin-operator
      - name: CSS integrity
        run: npm run test:css
      - name: HTML structure guard
        run: npm run test:html-structure
      - name: Fixed overview layout (browser)
        run: npm run test:layout2
      - name: Mobile and globe sizing
        run: npm run test:mobile
      - name: Reminder write safety (Miniflare)
        run: npm run test:reminder-write
      - name: Globe empty state
        run: npm run test:globe-empty
      - name: Globe per-request arcs
        run: npm run test:globe-arcs
      - name: Globe arc fan-out
        run: npm run test:globe-fanout
      - name: Item detail page (browser)
        run: npm run test:ui-item-page
      - name: Local bridge (cli)
        run: npm run test:cli
      - name: Run a command with the key in its environment (cli)
        run: npm run test:exec
      - name: Local vault daemon (cli)
        run: npm run test:daemon
      - name: Local client discovery (cli)
        run: npm run test:agents
      - name: DSH plugin refuses cross-site approvals
        run: npm run test:plugin-guard
      - name: Materialise allowlist (Miniflare)
        run: npm run test:materialize
      - name: Explain access (Miniflare)
        run: npm run test:explain
      - name: Muted notification channels (Miniflare)
        run: npm run test:notify-channels
      - name: AI assistant snapshot and switches (Miniflare)
        run: npm run test:ai-assistant
      - name: Envelope encryption (v2 key wrapping)
        run: npm run test:envelope
      - name: v2 schema on D1 (Miniflare)
        run: npm run test:v2-schema
      - name: v2 API (init, unlock, sealed items, tombstones)
        run: npm run test:v2-api
      - name: v2 CLI pairing (ECDH wrap both sides)
        run: npm run test:v2-cli
      - name: local vault tools (MCP from the rows this machine holds)
        run: npm run test:local-tools
      - name: v2 rekey (rotation, tombstone scrub, device re-signing)
        run: npm run test:v2-rekey
      - name: v2 device code pairing (short code, poll token, one-time redeem)
        run: npm run test:v2-paircode
      - name: v2 pull and push (sealed rows, write permission, revocation)
        run: npm run test:v2-pushpull
      - name: Full security suite (short path)
        run: npm run test:security:short
