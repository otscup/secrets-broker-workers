name: security

permissions:
  contents: read

# Tag references plus dependabot keep action security updates flowing without
# hand-maintained SHAs.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  # The vault suites need a workerd binary that some developer machines cannot
  # start; CI is where they actually run. Kept as its own job so a vault-only
  # regression is visible without reading the whole matrix output.
  miniflare-vault:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Prepare CI log directory
        run: mkdir -p "$RUNNER_TEMP/ci-logs"
      - name: v2 storage adapter (console and MCP read the v2 source)
        shell: bash
        run: npm run test:v2-adapter 2>&1 | tee "$RUNNER_TEMP/ci-logs/v2-adapter.log"
      - name: v2 API (init, unlock, sealed rows, TOTP-gated plaintext)
        shell: bash
        run: npm run test:v2-api 2>&1 | tee "$RUNNER_TEMP/ci-logs/v2-api.log"
      - name: v2 per-account keys, migration and isolation
        shell: bash
        run: npm run test:v2-accounts 2>&1 | tee "$RUNNER_TEMP/ci-logs/v2-accounts.log"
      - name: Stale cookie clearing and consent cookie split
        shell: bash
        run: npm run test:cookie-clearing 2>&1 | tee "$RUNNER_TEMP/ci-logs/cookie-clearing.log"
      - name: Approval pipeline (confirm page, then POST)
        shell: bash
        run: npm run test:approval 2>&1 | tee "$RUNNER_TEMP/ci-logs/approval.log"
      - name: OAuth consent, login bounce and single-use codes
        shell: bash
        run: npm run test:oauth-consent 2>&1 | tee "$RUNNER_TEMP/ci-logs/oauth-consent.log"
      - name: Account scoping
        shell: bash
        run: npm run test:account-scope 2>&1 | tee "$RUNNER_TEMP/ci-logs/account-scope.log"
      - name: Fill task control plane
        shell: bash
        run: npm run test:fill-task 2>&1 | tee "$RUNNER_TEMP/ci-logs/fill-task.log"
      - name: Admin session durability
        shell: bash
        run: npm run test:session 2>&1 | tee "$RUNNER_TEMP/ci-logs/session.log"
      - name: Upload test logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: miniflare-vault-logs
          path: ${{ runner.temp }}/ci-logs
          if-no-files-found: warn
          retention-days: 7
      # Artifacts need a token to download; the step summary does not, so the
      # failing suite's tail is readable straight from the run page.
      - name: Publish failing suite log tail
        if: failure()
        shell: bash
        run: |
          dir="$RUNNER_TEMP/ci-logs"
          [ -d "$dir" ] || exit 0
          shopt -s nullglob
          logs=("$dir"/*.log)
          [ ${#logs[@]} -gt 0 ] || exit 0
          # The job stops at the first broken suite, so its log is the newest
          # one. Ninety logs in the summary would bury the only interesting one.
          newest=$(ls -t "${logs[@]}" | head -n 1)
          [ -s "$newest" ] || exit 0
          {
            echo "### $(basename "$newest")"
            echo '```'
            tail -n 80 "$newest"
            echo
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          # A job only shows ten annotations, so spend them on the lines that
          # name the failure instead of the whole tail. Strip \r and % first:
          # both break the workflow-command syntax GitHub parses here.
          tail -n 80 "$newest" | tr -d '\r' | tr -d '%' | grep -E 'FAIL|Error|AssertionError|expected|received' | head -n 10 | while IFS= read -r line; do
            printf '::error::%s\n' "$line"
          done
          true
  # The hybrid permission model broke three runs in a row and, because it sat
  # at step 16 of security-tests, every suite behind it was skipped. It gets
  # its own job so its result is visible on its own and cannot short-circuit
  # the rest of the security suite.
  permissions-model:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Prepare CI log directory
        run: mkdir -p "$RUNNER_TEMP/ci-logs"
      - name: Hybrid secret.read/use model (Miniflare)
        shell: bash
        run: npm run test:actions 2>&1 | tee "$RUNNER_TEMP/ci-logs/actions.log"
      - name: Upload test logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: permissions-model-logs
          path: ${{ runner.temp }}/ci-logs
          if-no-files-found: warn
          retention-days: 7
      # Artifacts need a token to download; the step summary does not, so the
      # failing suite's tail is readable straight from the run page.
      - name: Publish failing suite log tail
        if: failure()
        shell: bash
        run: |
          dir="$RUNNER_TEMP/ci-logs"
          [ -d "$dir" ] || exit 0
          shopt -s nullglob
          logs=("$dir"/*.log)
          [ ${#logs[@]} -gt 0 ] || exit 0
          # The job stops at the first broken suite, so its log is the newest
          # one. Ninety logs in the summary would bury the only interesting one.
          newest=$(ls -t "${logs[@]}" | head -n 1)
          [ -s "$newest" ] || exit 0
          {
            echo "### $(basename "$newest")"
            echo '```'
            tail -n 80 "$newest"
            echo
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          # A job only shows ten annotations, so spend them on the lines that
          # name the failure instead of the whole tail. Strip \r and % first:
          # both break the workflow-command syntax GitHub parses here.
          tail -n 80 "$newest" | tr -d '\r' | tr -d '%' | grep -E 'FAIL|Error|AssertionError|expected|received' | head -n 10 | while IFS= read -r line; do
            printf '::error::%s\n' "$line"
          done
          true
  # Suites that only exercise the rendered console (globe, layout, CSS, item
  # page). Split out so a UI-only regression cannot skip the security suites
  # that used to sit behind it in security-tests.
  ui-suites:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      # The geometry suites (layout2, mobile, ui-item-page) shell out to a real
      # browser. ubuntu-latest does not ship Chrome, and the suites used to hard
      # code a Windows path, so they reported "chrome produced no measurement".
      # Stable is enough for --headless=new --dump-dom and avoids version drift.
      - name: Set up Chrome
        id: setup-chrome
        uses: browser-actions/setup-chrome@v1
        with:
          chrome-version: stable
      # Publish the resolved binary through $GITHUB_ENV so every later step sees
      # it without repeating the steps.* context in each step's env.
      - name: Export Chrome path for the browser suites
        run: |
          echo "CHROME_PATH=${{ steps.setup-chrome.outputs.chrome-path }}" >> "$GITHUB_ENV"
          echo "CHROME_BIN=${{ steps.setup-chrome.outputs.chrome-path }}" >> "$GITHUB_ENV"
      - run: npm ci --no-audit --no-fund
      - name: Prepare CI log directory
        run: mkdir -p "$RUNNER_TEMP/ci-logs"
      - name: Admin UI smoke (Miniflare)
        shell: bash
        run: npm run test:ui 2>&1 | tee "$RUNNER_TEMP/ci-logs/ui.log"
      - name: Globe UI (Miniflare)
        shell: bash
        run: npm run test:globe-ui 2>&1 | tee "$RUNNER_TEMP/ci-logs/globe-ui.log"
      - name: Globe arcs (Miniflare)
        shell: bash
        run: npm run test:globe-arcs 2>&1 | tee "$RUNNER_TEMP/ci-logs/globe-arcs.log"
      - name: Globe route variance
        shell: bash
        run: npm run test:globe-routes 2>&1 | tee "$RUNNER_TEMP/ci-logs/globe-routes.log"
      - name: Globe visuals (Miniflare)
        shell: bash
        run: npm run test:globe-visuals 2>&1 | tee "$RUNNER_TEMP/ci-logs/globe-visuals.log"
      - name: Globe earth and danmaku (Miniflare)
        shell: bash
        run: npm run test:globe-earth 2>&1 | tee "$RUNNER_TEMP/ci-logs/globe-earth.log"
      - name: Globe init and failure reporting (Miniflare)
        shell: bash
        run: npm run test:globe-init 2>&1 | tee "$RUNNER_TEMP/ci-logs/globe-init.log"
      - name: UI undefined-call scan
        shell: bash
        run: npm run test:ui-undefined 2>&1 | tee "$RUNNER_TEMP/ci-logs/ui-undefined.log"
      - name: Globe API guard
        shell: bash
        run: npm run test:globe-api 2>&1 | tee "$RUNNER_TEMP/ci-logs/globe-api.log"
      - name: UI polish (Miniflare)
        shell: bash
        run: npm run test:ui-polish 2>&1 | tee "$RUNNER_TEMP/ci-logs/ui-polish.log"
      - name: Layout and naming (Miniflare)
        shell: bash
        run: npm run test:layout 2>&1 | tee "$RUNNER_TEMP/ci-logs/layout.log"
      - name: Panel polish (Miniflare)
        shell: bash
        run: npm run test:panel 2>&1 | tee "$RUNNER_TEMP/ci-logs/panel.log"
      - name: Donut legend layout
        shell: bash
        run: npm run test:donut 2>&1 | tee "$RUNNER_TEMP/ci-logs/donut.log"
      - name: Fill UI placement
        shell: bash
        run: npm run test:fill-placement 2>&1 | tee "$RUNNER_TEMP/ci-logs/fill-placement.log"
      - name: CSS integrity
        shell: bash
        run: npm run test:css 2>&1 | tee "$RUNNER_TEMP/ci-logs/css.log"
      - name: HTML structure guard
        shell: bash
        run: npm run test:html-structure 2>&1 | tee "$RUNNER_TEMP/ci-logs/html-structure.log"
      - name: Fixed overview layout (browser)
        shell: bash
        run: npm run test:layout2 2>&1 | tee "$RUNNER_TEMP/ci-logs/layout2.log"
      - name: Mobile and globe sizing
        shell: bash
        run: npm run test:mobile 2>&1 | tee "$RUNNER_TEMP/ci-logs/mobile.log"
      - name: Globe empty state
        shell: bash
        run: npm run test:globe-empty 2>&1 | tee "$RUNNER_TEMP/ci-logs/globe-empty.log"
      # "Globe per-request arcs" used to run test:globe-arcs a second time under
      # a globe-arcs-2.log name. It is the same script as "Globe arcs" above, so
      # the copy is gone; fan-out is a different suite and stays.
      - name: Globe arc fan-out
        shell: bash
        run: npm run test:globe-fanout 2>&1 | tee "$RUNNER_TEMP/ci-logs/globe-fanout.log"
      - name: Item detail page (browser)
        shell: bash
        run: npm run test:ui-item-page 2>&1 | tee "$RUNNER_TEMP/ci-logs/ui-item-page.log"
      - name: Upload test logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ui-suites-logs
          path: ${{ runner.temp }}/ci-logs
          if-no-files-found: warn
          retention-days: 7
      # Artifacts need a token to download; the step summary does not, so the
      # failing suite's tail is readable straight from the run page.
      - name: Publish failing suite log tail
        if: failure()
        shell: bash
        run: |
          dir="$RUNNER_TEMP/ci-logs"
          [ -d "$dir" ] || exit 0
          shopt -s nullglob
          logs=("$dir"/*.log)
          [ ${#logs[@]} -gt 0 ] || exit 0
          # The job stops at the first broken suite, so its log is the newest
          # one. Ninety logs in the summary would bury the only interesting one.
          newest=$(ls -t "${logs[@]}" | head -n 1)
          [ -s "$newest" ] || exit 0
          {
            echo "### $(basename "$newest")"
            echo '```'
            tail -n 80 "$newest"
            echo
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          # A job only shows ten annotations, so spend them on the lines that
          # name the failure instead of the whole tail. Strip \r and % first:
          # both break the workflow-command syntax GitHub parses here.
          tail -n 80 "$newest" | tr -d '\r' | tr -d '%' | grep -E 'FAIL|Error|AssertionError|expected|received' | head -n 10 | while IFS= read -r line; do
            printf '::error::%s\n' "$line"
          done
          true
  security-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Prepare CI log directory
        run: mkdir -p "$RUNNER_TEMP/ci-logs"
      # Pure unit suites (no runtime required).
      - name: OIDC unit tests
        shell: bash
        run: npm run test:oidc 2>&1 | tee "$RUNNER_TEMP/ci-logs/oidc.log"
      - name: R1/R6 atomic + scope predicate
        shell: bash
        run: npm run test:r1-r6 2>&1 | tee "$RUNNER_TEMP/ci-logs/r1-r6.log"
      # Regression suites for audit storage, fill task lifecycle, approval
      # grant scope and id-addressed reads. They import src/index.js under the
      # Node loader shim (same model as test-r1-r6), so they belong with the
      # pure unit steps rather than the workerd/Miniflare job.
      - name: Audit storage in D1 (no runtime)
        shell: bash
        run: npm run test:audit-d1 2>&1 | tee "$RUNNER_TEMP/ci-logs/audit-d1.log"
      - name: Fill task lifecycle and sweep (no runtime)
        shell: bash
        run: npm run test:fill-task-lifecycle 2>&1 | tee "$RUNNER_TEMP/ci-logs/fill-task-lifecycle.log"
      - name: Approval grant scope (no runtime)
        shell: bash
        run: npm run test:approval-grant-scope 2>&1 | tee "$RUNNER_TEMP/ci-logs/approval-grant-scope.log"
      - name: Connection request notifications (no runtime)
        shell: bash
        run: npm run test:connection-notify 2>&1 | tee "$RUNNER_TEMP/ci-logs/connection-notify.log"
      - name: Connection admission and scope (no runtime)
        shell: bash
        run: npm run test:connection-admission 2>&1 | tee "$RUNNER_TEMP/ci-logs/connection-admission.log"
      - name: Item approval wait, deny and replay (no runtime)
        shell: bash
        run: npm run test:pending-approval 2>&1 | tee "$RUNNER_TEMP/ci-logs/pending-approval.log"
      - name: Overview stats and detail panels (no runtime)
        shell: bash
        run: npm run test:overview-stats 2>&1 | tee "$RUNNER_TEMP/ci-logs/overview-stats.log"
      - name: Id-addressed secret reads (no runtime)
        shell: bash
        run: npm run test:secret-read-by-id 2>&1 | tee "$RUNNER_TEMP/ci-logs/secret-read-by-id.log"
      - name: Vault unlock survives an object restart (no runtime)
        shell: bash
        run: npm run test:v2-unlock-persist 2>&1 | tee "$RUNNER_TEMP/ci-logs/v2-unlock-persist.log"
      # Fails if src/version.js drifted from package.json, and pins the shape of
      # /api/version (200 without the optional binding, no extra fields).
      - name: Version endpoint and single-source check (no runtime)
        shell: bash
        run: npm run test:version 2>&1 | tee "$RUNNER_TEMP/ci-logs/version.log"
      - name: Plaintext credential scan (no runtime)
        shell: bash
        run: npm run test:scan 2>&1 | tee "$RUNNER_TEMP/ci-logs/scan.log"
      - name: Commit guard against vault values (no runtime)
        shell: bash
        run: npm run test:guard 2>&1 | tee "$RUNNER_TEMP/ci-logs/guard.log"
      - name: Local ciphertext cache (no runtime)
        shell: bash
        run: npm run test:cache 2>&1 | tee "$RUNNER_TEMP/ci-logs/cache.log"
      - name: Offline pull from the cache (no runtime)
        shell: bash
        run: npm run test:offline 2>&1 | tee "$RUNNER_TEMP/ci-logs/offline.log"
      - name: Pairing key never lands in a readable file (no runtime)
        shell: bash
        run: npm run test:devkey 2>&1 | tee "$RUNNER_TEMP/ci-logs/devkey.log"
      # workerd-backed suites: real Durable Object storage/transaction semantics.
      - name: OIDC state replay (Miniflare)
        shell: bash
        run: npm run test:mcp-oidc 2>&1 | tee "$RUNNER_TEMP/ci-logs/mcp-oidc.log"
      - name: maxReads concurrency (Miniflare)
        shell: bash
        run: npm run test:maxreads 2>&1 | tee "$RUNNER_TEMP/ci-logs/maxreads.log"
      - name: Agent permission matrix (Miniflare)
        shell: bash
        run: npm run test:permissions 2>&1 | tee "$RUNNER_TEMP/ci-logs/permissions.log"
      - name: Admin API authorization (Miniflare)
        shell: bash
        run: npm run test:admin-api 2>&1 | tee "$RUNNER_TEMP/ci-logs/admin-api.log"
      - name: Unified capabilities (Miniflare)
        shell: bash
        run: npm run test:capabilities 2>&1 | tee "$RUNNER_TEMP/ci-logs/capabilities.log"
      - name: Capability admin API (Miniflare)
        shell: bash
        run: npm run test:capabilities-admin 2>&1 | tee "$RUNNER_TEMP/ci-logs/capabilities-admin.log"
      - name: Bulk grants + agent write (Miniflare)
        shell: bash
        run: npm run test:batch-write 2>&1 | tee "$RUNNER_TEMP/ci-logs/batch-write.log"
      - name: Approval bound to its target (Miniflare)
        shell: bash
        run: npm run test:target-binding 2>&1 | tee "$RUNNER_TEMP/ci-logs/target-binding.log"
      - name: Independent review regression (Miniflare)
        shell: bash
        run: npm run test:review-fixes 2>&1 | tee "$RUNNER_TEMP/ci-logs/review-fixes.log"
      - name: State machine edge cases (Miniflare)
