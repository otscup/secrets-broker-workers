name: security

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  security-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm install --no-audit --no-fund
      # Pure unit suites (no runtime required).
      - name: OIDC unit tests
        run: npm run test:oidc
      - name: R1/R6 atomic + scope predicate
        run: npm run test:r1-r6
      # workerd-backed suites: real Durable Object storage/transaction semantics.
      - name: OIDC state replay (Miniflare)
        run: npm run test:mcp-oidc
      - name: maxReads concurrency (Miniflare)
        run: npm run test:maxreads
      - name: Agent permission matrix (Miniflare)
        run: npm run test:permissions
      - name: Hybrid secret.read/use model (Miniflare)
        run: npm run test:actions
      - name: Approval pipeline bypass (Miniflare)
        run: npm run test:approval
      - name: Admin API authorization (Miniflare)
        run: npm run test:admin-api
      - name: Unified capabilities (Miniflare)
        run: npm run test:capabilities
      - name: Capability admin API (Miniflare)
        run: npm run test:capabilities-admin
      - name: Independent review regression (Miniflare)
        run: npm run test:review-fixes
      - name: State machine edge cases (Miniflare)
        run: npm run test:state-machine
      - name: Capability ensure authority (Miniflare)
        run: npm run test:ensure-authority
      - name: Legacy scope behaviour (Miniflare)
        run: npm run test:legacy-scope
      - name: Migration identity + real revoke (Miniflare)
        run: npm run test:identity-revoke
      - name: Account scoping (Miniflare)
        run: npm run test:account-scope
      - name: Agent authorization extension (Miniflare)
        run: npm run test:agent-extend
      - name: OAuth consent login flow (Miniflare)
        run: npm run test:oauth-consent
      - name: OAuth client persistence (Miniflare)
        run: npm run test:oauth-persist
      - name: OAuth client management (Miniflare)
        run: npm run test:oauth-clients
      - name: OAuth re-login resume (Miniflare)
        run: npm run test:oauth-resume
      - name: Admin session durability (Miniflare)
        run: npm run test:session
      - name: State write safety (Miniflare)
        run: npm run test:state-write
      - name: Stale cookie clearing (Miniflare)
        run: npm run test:cookie-clearing
      - name: Admin UI smoke (Miniflare)
        run: npm run test:ui
      - name: Authorization reminders (Miniflare)
        run: npm run test:reminders
      - name: Item activity columns (Miniflare)
        run: npm run test:items
      - name: Scheduled reminder handler (Miniflare)
        run: npm run test:scheduled
      - name: Geo event storage (Miniflare)
        run: npm run test:geo-storage
      - name: Geo event capture (Miniflare)
        run: npm run test:geo-capture
      - name: Globe UI (Miniflare)
        run: npm run test:globe-ui
      - name: Globe arcs (Miniflare)
        run: npm run test:globe-arcs
      - name: Globe visuals (Miniflare)
        run: npm run test:globe-visuals
      - name: Globe earth and danmaku (Miniflare)
        run: npm run test:globe-earth
      - name: Globe init and failure reporting (Miniflare)
        run: npm run test:globe-init
      - name: UI undefined-call scan
        run: npm run test:ui-undefined
      - name: Reported bug fixes (Miniflare)
        run: npm run test:bugfixes
      - name: Globe API guard
        run: npm run test:globe-api
      - name: UI polish (Miniflare)
        run: npm run test:ui-polish
      - name: Layout and naming (Miniflare)
        run: npm run test:layout
      - name: Panel polish (Miniflare)
        run: npm run test:panel
      - name: CSS integrity
        run: npm run test:css
