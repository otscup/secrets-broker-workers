        shell: bash
        run: npm run test:v2-paircode 2>&1 | tee "$RUNNER_TEMP/ci-logs/v2-paircode.log"
      - name: v2 pull and push (sealed rows, write permission, revocation)
        shell: bash
        run: npm run test:v2-pushpull 2>&1 | tee "$RUNNER_TEMP/ci-logs/v2-pushpull.log"
      - name: http_request failure semantics (pure Node)
        shell: bash
        run: npm run test:http-request 2>&1 | tee "$RUNNER_TEMP/ci-logs/http-request.log"
      - name: Full security suite (short path)
        shell: bash
        run: npm run test:security:short 2>&1 | tee "$RUNNER_TEMP/ci-logs/security-short.log"
      - name: Upload test logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: security-tests-logs
          path: ${{ runner.temp }}/ci-logs
          if-no-files-found: warn
          retention-days: 7
      # Artifacts need a token to download; the step summary does not, so the
      # failing suite's tail is readable straight from the run page.
      - name: Publish failing suite log tail
        if: failure()
        shell: bash
        run: |
          dir="$RUNNER_TEMP/ci-logs"
          [ -d "$dir" ] || exit 0
          shopt -s nullglob
          logs=("$dir"/*.log)
          [ ${#logs[@]} -gt 0 ] || exit 0
          # The job stops at the first broken suite, so its log is the newest
          # one. Ninety logs in the summary would bury the only interesting one.
          newest=$(ls -t "${logs[@]}" | head -n 1)
          [ -s "$newest" ] || exit 0
          {
            echo "### $(basename "$newest")"
            echo '```'
            tail -n 80 "$newest"
            echo
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          # A job only shows ten annotations, so spend them on the lines that
          # name the failure instead of the whole tail. Strip \r and % first:
          # both break the workflow-command syntax GitHub parses here.
          tail -n 80 "$newest" | tr -d '\r' | tr -d '%' | grep -E 'FAIL|Error|AssertionError|expected|received' | head -n 10 | while IFS= read -r line; do
            printf '::error::%s\n' "$line"
          done
          true