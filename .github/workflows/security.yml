      - name: Migration identity + real revoke (Miniflare)
        shell: bash
        run: npm run test:identity-revoke 2>&1 | tee "$RUNNER_TEMP/ci-logs/identity-revoke.log"
      - name: Agent authorization extension (Miniflare)
